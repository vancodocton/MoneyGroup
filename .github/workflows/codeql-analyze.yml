name: "CodeQL Analyze"

# Called by codeql.yml, once per language. Keep the `analyze` job name and the
# category: code scanning identifies an analysis by workflow, job and category, so
# changing them would split the alert history.
on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
        description: The CodeQL language to scan.

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        if: inputs.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/dotnet-tools.json

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.language }}
          # Only C# needs its code built to be scanned.
          build-mode: ${{ inputs.language == 'csharp' && 'manual' || 'none' }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      - name: Build
        if: inputs.language == 'csharp'
        shell: bash
        run: |
          dotnet build --configuration Release MoneyGroup.slnx

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ inputs.language }}"
