on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Runs every job, and deploys when started on main.
  workflow_dispatch:
  # Runs every job as a health check, and never publishes or deploys.
  schedule:
    - cron: "13 1 * * 4"

concurrency:
  # A new push replaces a PR's run. Every other run gets its own group, because
  # pushes compare against the previous commit, so a replaced run would lose its
  # changes. The deploy jobs queue separately.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      # A CI change runs every job on its PR. Once merged it has been proven, so
      # it does not run them again or deploy.
      backend: ${{ steps.changes.outputs.backend == 'true' || (github.event_name == 'pull_request' && steps.changes.outputs.ci-config == 'true') }}
      frontend: ${{ steps.changes.outputs.frontend == 'true' || (github.event_name == 'pull_request' && steps.changes.outputs.ci-config == 'true') }}
      deploy-api: ${{ steps.changes.outputs.backend == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      deploy-web: ${{ steps.changes.outputs.frontend == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  backend:
    uses: ./.github/workflows/dotnet.yml
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    with:
      # `publish-image` builds it instead, so it isn't built twice.
      skip-image-check: ${{ needs.changes.outputs.deploy-api == 'true' }}
    # Forward only the repository secrets dotnet.yml actually reads, instead of
    # handing it every repository secret via `secrets: inherit`.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # The image job inside needs these. Each job there declares only what it uses.
    permissions:
      contents: read
      packages: write
      id-token: write

  frontend:
    uses: ./.github/workflows/clientapp.yml
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read

  # The single required check. Its job name must stay `gate`.
  gate:
    name: gate
    needs: [changes, backend, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce component checks by changed paths
        shell: bash
        run: |
          set -euo pipefail

          changes_result='${{ needs.changes.result }}'
          if [[ "${changes_result}" != "success" ]]; then
            echo "Change detection job did not succeed."
            exit 1
          fi

          be_needed='${{ needs.changes.outputs.backend }}'
          fe_needed='${{ needs.changes.outputs.frontend }}'
          be_result='${{ needs.backend.result }}'
          fe_result='${{ needs.frontend.result }}'

          echo "backend needed: ${be_needed}, result: ${be_result}"
          echo "frontend needed: ${fe_needed}, result: ${fe_result}"

          if [[ "${be_needed}" == "true" && "${be_result}" != "success" ]]; then
            echo "Backend checks were required but did not succeed."
            exit 1
          fi

          if [[ "${fe_needed}" == "true" && "${fe_result}" != "success" ]]; then
            echo "Frontend checks were required but did not succeed."
            exit 1
          fi

          echo "Monorepo gate passed."

  # Publishes only after `gate`, so a failed commit never gets a published image.
  # A separate job, so the Docker build never runs alongside the Azure secrets, and
  # re-running a failed deploy reuses this image.
  publish-image:
    name: publish image
    needs: [changes, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.changes.outputs.deploy-api == 'true' }}
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
      id-token: write

  # Lives here rather than in a reusable workflow so it can declare `environment:`
  # itself. That unlocks the AZURE_* environment secrets without `secrets: inherit`,
  # which would let the called workflow read every secret.
  deploy-api:
    name: deploy api
    needs: publish-image
    if: ${{ !cancelled() && needs.publish-image.result == 'success' }}
    runs-on: ubuntu-latest
    environment: Development
    concurrency: deploy-api
    permissions:
      id-token: write
      contents: read
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Build the immutable image reference from the digest the publish-image
      # job produced and signed. github.repository is mixed case
      # (vancodocton/MoneyGroup) and container registries reject non-lowercase
      # paths, so lowercase it here.
      - name: Resolve image reference
        id: image
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::publish-image job produced no digest, refusing to deploy."
            exit 1
          fi
          echo "ref=${REGISTRY,,}/${IMAGE_NAME,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy Azure Container App
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          registryUrl: ${{ env.REGISTRY }}
          imageToDeploy: ${{ steps.image.outputs.ref }}

  # Ships the dist the frontend job already built and linted.
  deploy-web:
    name: deploy web
    needs: [changes, frontend, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.frontend.result == 'success' && needs.changes.outputs.deploy-web == 'true' }}
    runs-on: ubuntu-latest
    concurrency: deploy-web
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: clientapp-dist
          path: src/ClientApp/dist

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        env:
          # The token isn't configured while SWA hosting is on hold. This job then
          # passes without deploying, so a client change doesn't fail the main run.
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_FOREST_03B3E8000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/src/ClientApp/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          production_branch: main
