name: .NET CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      skip-image-check:
        type: boolean
        required: false
        description: Skip the image check, for runs that build the image anyway to publish it.
        default: false
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud analysis token, used by the begin/end scanner steps.
        required: false
      CODECOV_TOKEN:
        description: Codecov upload token, used to publish the merged coverage report.
        required: false

env:
  Solution: MoneyGroup.slnx

jobs:
  verify-format:
    name: Verify Code Format
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          # Differs from the build job on purpose: a shared key lets this job save first and lock out
          # the build job's cache, which also holds the dotnet tools and the Aspire CLI bundle package.
          cache-dependency-path: |
            **/packages.lock.json

      - name: Verify Format
        run: dotnet format ${{ env.Solution }} --verify-no-changes -v diag --severity info

  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Docker Compose Up
        run: docker compose up -d mssql

      - name: Cache SonarQube Cloud packages
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/dotnet-tools.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Begin Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # On a PR, End Analyze waits for the quality gate and fails if it fails, so `gate`
          # covers SonarQube Cloud. Not on main, where the PR already passed it, so a gate
          # change on SonarQube Cloud never blocks a deploy.
          QUALITY_GATE_WAIT: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          dotnet sonarscanner begin /k:"vancodocton_MoneyGroup" /o:"vancodocton" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.scanner.skipJreProvisioning=true /d:sonar.qualitygate.wait="$env:QUALITY_GATE_WAIT"

      - name: Restore
        run: dotnet restore ${{ env.Solution }}

      - name: Build
        run: dotnet build ${{ env.Solution }} --no-restore --configuration Release

      - name: Test
        shell: pwsh
        run: |
          docker compose up --wait mssql
          dotnet test --solution ${{ env.Solution }} --no-build --configuration Release --verbosity normal --coverage --config-file $pwd/testconfig.json --report-xunit-xml

      - name: End Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          dotnet coverage merge ./**/TestResults/**.xml --output coverage.xml --output-format xml
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Upload TestResults Artifacts
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: ${{ runner.os }}-TestResults
          path: |
            **/TestResults/**
            coverage.xml

      - name: Upload TestResults to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: vancodocton/MoneyGroup
          disable_search: true
          files: ./coverage.xml
          # The coverage job waits for this upload's statuses, so a failed upload
          # fails here instead of timing out there.
          fail_ci_if_error: ${{ github.event_name == 'pull_request' }}

  # Codecov posts codecov/project and codecov/patch after the build job, so the
  # required `gate` check could pass before them. This waits for them and fails if
  # either fails. Only on PRs, like the quality gate wait above.
  coverage:
    name: Coverage Status
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Codecov reports on the PR head, not on the merge commit this run checked out.
      SHA: ${{ github.event.pull_request.head.sha }}
      # Must match the statuses Codecov is set to post.
      CONTEXTS: codecov/project codecov/patch
      TIMEOUT_SECONDS: 600
    steps:
      - name: Wait for Codecov statuses
        shell: bash
        run: |
          set -euo pipefail

          # Codecov posts check runs when its GitHub App is installed, and commit
          # statuses otherwise, so read both. Prints "<conclusion> <url>", or nothing
          # until the result is in.
          result() {
            local name="$1" run status
            run=$(gh api "repos/${REPO}/commits/${SHA}/check-runs?check_name=${name}&filter=latest" \
              --jq '.check_runs | sort_by(.started_at) | last // empty | "\(.status) \(.conclusion) \(.details_url)"')
            if [[ -n "${run}" ]]; then
              read -r status conclusion url <<< "${run}"
              [[ "${status}" == "completed" ]] && echo "${conclusion} ${url}"
              return 0
            fi
            status=$(gh api "repos/${REPO}/commits/${SHA}/status" --paginate \
              --jq "[.statuses[] | select(.context == \"${name}\")] | first // empty | \"\(.state) \(.target_url)\"")
            if [[ -n "${status}" && "${status%% *}" != "pending" ]]; then
              echo "${status}"
            fi
          }

          deadline=$(( SECONDS + TIMEOUT_SECONDS ))
          pending="${CONTEXTS}"
          failed=0
          while [[ -n "${pending// /}" ]]; do
            still=""
            for name in ${pending}; do
              # A failed API call counts as not in yet, so a blip doesn't fail the PR.
              r=$(result "${name}") || r=""
              if [[ -z "${r}" ]]; then
                still+=" ${name}"
                continue
              fi
              echo "${name}: ${r}"
              case "${r%% *}" in
                success|neutral|skipped) ;;
                *) echo "::error::${name} did not pass: ${r}"; failed=1 ;;
              esac
            done
            pending="${still}"
            [[ -z "${pending// /}" ]] && break
            if (( SECONDS >= deadline )); then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for:${pending}"
              exit 1
            fi
            echo "Waiting for:${pending}"
            sleep 15
          done

          exit "${failed}"

  # Only checks that the image builds, alongside format and tests to save time.
  # docker.yml declares the permissions below, so they must be granted even though
  # nothing is pushed. A separate job, so it never holds the Sonar and Codecov tokens.
  image:
    name: Image
    if: ${{ !inputs.skip-image-check }}
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
