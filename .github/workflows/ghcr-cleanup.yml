name: GHCR cleanup

# Keeps `main`, every image from the last 7 days, and the 4 newest images older
# than that, so a quiet week still leaves something to roll back to. Deletes the
# rest. Previous images are untagged because `main` moves on each publish, so
# they are counted with keep-n-untagged. older-than applies first, so that count
# covers only images past the 7 days.
#
# Don't replace this with a plain "delete untagged" step: an image's platform
# and attestation manifests are untagged versions too, and deleting them breaks
# the image. This action treats each image and its children as one unit.
on:
  schedule:
    - cron: "33 1 * * 4"
  # Dry run unless unticked, so a manual run can't delete by accident.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would be deleted
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: moneygroup
          exclude-tags: main
          older-than: 7 days
          keep-n-untagged: 4
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
