name: .NET CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      skip-image-check:
        type: boolean
        required: false
        description: Skip the image check, for runs that build the image anyway to publish it.
        default: false
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud analysis token, used by the begin/end scanner steps.
        required: false
      CODECOV_TOKEN:
        description: Codecov upload token, used to publish the merged coverage report.
        required: false

env:
  Solution: MoneyGroup.slnx

jobs:
  verify-format:
    name: Verify Code Format
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          cache: true
          # Differs from the build job on purpose: a shared key lets this job save first and lock out
          # the build job's cache, which also holds the dotnet tools and the Aspire CLI bundle package.
          cache-dependency-path: |
            **/packages.lock.json

      - name: Verify Format
        run: dotnet format ${{ env.Solution }} --verify-no-changes -v diag --severity info

  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Docker Compose Up
        run: docker compose up -d mssql

      - name: Cache SonarQube Cloud packages
        id: cache-sonar-scanner
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/dotnet-tools.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Begin Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        # Every analysis parameter is set here. The SonarQube Cloud project settings only hold the Automatic
        # Analysis toggle, which must stay off for CI analysis. Report paths must match the Test and End Analyze steps.
        run: |
          # Single quotes keep pwsh from expanding the globs or splitting the values on commas.
          $sonarArgs = @(
            '/k:vancodocton_MoneyGroup'
            '/o:vancodocton'
            "/d:sonar.token=$env:SONAR_TOKEN"
            '/d:sonar.host.url=https://sonarcloud.io'
            '/d:sonar.scanner.skipJreProvisioning=true'
            # Microsoft (VS) XML coverage, merged into coverage.xml in End Analyze.
            '/d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml'
            # xUnit v3 XML from --report-xunit-xml. It keeps the v2 <assemblies>/<assembly> layout Sonar reads.
            '/d:sonar.cs.xunit.reportsPaths=**/TestResults/*.xunit.xml'
            # Migrations are generated. src/ClientApp has no test runner yet, so it has no coverage to report.
            '/d:sonar.coverage.exclusions=**/Migrations/*.cs,src/ClientApp/**'
            '/d:sonar.cpd.exclusions=**/Migrations/*.cs'
            # S7637 reads only the inline uses: ref, not actions.lock, which pins every action's commit
            # (enforced by actions-lock.yml). TODO(#578): remove once SonarQube Cloud supports actions.lock.
            '/d:sonar.issue.ignore.multicriteria=gha1'
            '/d:sonar.issue.ignore.multicriteria.gha1.ruleKey=githubactions:S7637'
            '/d:sonar.issue.ignore.multicriteria.gha1.resourceKey=.github/workflows/**'
          )
          dotnet sonarscanner begin @sonarArgs

      - name: Restore
        run: dotnet restore ${{ env.Solution }}

      - name: Build
        run: dotnet build ${{ env.Solution }} --no-restore --configuration Release

      - name: Test
        shell: pwsh
        run: |
          docker compose up --wait mssql
          dotnet test --solution ${{ env.Solution }} --no-build --configuration Release --verbosity normal --coverage --config-file $pwd/testconfig.json --report-xunit-xml

      - name: End Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          dotnet coverage merge ./**/TestResults/**.xml --output coverage.xml --output-format xml
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Upload TestResults Artifacts
        uses: actions/upload-artifact@v7.0.2
        if: success() || failure()
        with:
          name: ${{ runner.os }}-TestResults
          path: |
            **/TestResults/**
            coverage.xml

      - name: Upload TestResults to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: vancodocton/MoneyGroup
          disable_search: true
          files: ./coverage.xml

  # Only checks that the image builds, alongside format and tests to save time.
  # docker.yml declares the permissions below, so they must be granted even though
  # nothing is pushed. A separate job, so it never holds the Sonar and Codecov tokens.
  image:
    name: Image
    if: ${{ !inputs.skip-image-check }}
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
