name: Detect changes
description: >-
  Reports which areas in .github/filters.yml changed. PRs compare against their
  base branch and pushes against the previous commit. Other events, such as
  schedule and workflow_dispatch, report everything as changed. The caller must
  check out the repository first.

outputs:
  ci-config:
    description: Whether CI configuration changed.
    value: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.ci-config == 'true' }}
  codeql-config:
    description: Whether CodeQL configuration changed.
    value: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.codeql-config == 'true' }}
  backend:
    description: Whether backend paths changed.
    value: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.backend == 'true' }}
  frontend:
    description: Whether frontend paths changed.
    value: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.frontend == 'true' }}

runs:
  using: composite
  steps:
    - name: Detect changed paths
      id: filter
      if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: .github/filters.yml
