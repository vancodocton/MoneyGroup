name: "CodeQL Advanced"

# Deliberately not called from gate.yml, so a failed scan doesn't turn a deploy run
# red. One job per language that changed, and every language on cron and manual runs.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Scans every language, which also picks up new CodeQL queries for unchanged code.
  schedule:
    - cron: "43 0 * * 4"
  workflow_dispatch:

concurrency:
  # A new push replaces a PR's run. Every other run gets its own group, because
  # pushes compare against the previous commit, so a replaced run would lose its
  # changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What the scan jobs need. `changes` declares its own.
permissions:
  # required for all workflows
  security-events: write

  # required to fetch internal or private CodeQL packs
  packages: read

  # only required for workflows in private repositories
  actions: read
  contents: read

jobs:
  changes:
    name: detect changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      actions: ${{ steps.changes.outputs.ci-config }}
      csharp: ${{ steps.changes.outputs.backend == 'true' || steps.changes.outputs.codeql-config == 'true' }}
      js: ${{ steps.changes.outputs.frontend == 'true' || steps.changes.outputs.codeql-config == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  codeql-actions:
    uses: ./.github/workflows/codeql-analyze.yml
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    with:
      language: actions

  codeql-csharp:
    uses: ./.github/workflows/codeql-analyze.yml
    needs: changes
    if: ${{ needs.changes.outputs.csharp == 'true' }}
    with:
      language: csharp

  codeql-js:
    uses: ./.github/workflows/codeql-analyze.yml
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    with:
      language: javascript-typescript
