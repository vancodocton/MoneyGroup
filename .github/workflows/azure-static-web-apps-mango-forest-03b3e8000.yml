name: Azure Static Web Apps PR preview

# PR previews only. Production deploys come from the deploy-web job in gate.yml.
on:
  pull_request:
    # `closed` is what lets close_pull_request_job remove the preview.
    types: [opened, synchronize, reopened, closed]
    branches: ["main"]
    paths:
      - src/ClientApp/**
      - .github/workflows/azure-static-web-apps-mango-forest-03b3e8000.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Dependabot and fork PRs have no deployment token, so skip the deploy instead of
# failing.
env:
  SKIP_DEPLOY_ON_MISSING_SECRETS: true

jobs:
  build_and_deploy_job:
    if: github.event.action != 'closed'
    runs-on: ubuntu-26.04
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          cache: 'npm'
          cache-dependency-path: src/ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: src/ClientApp

      - name: Build client app
        run: npm run build
        working-directory: src/ClientApp

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_FOREST_03B3E8000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/src/ClientApp/dist" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true
          production_branch: main
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event.action == 'closed'
    runs-on: ubuntu-26.04
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_FOREST_03B3E8000 }}
          action: "close"
