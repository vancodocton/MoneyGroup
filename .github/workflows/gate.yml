on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' }}
      deploy: ${{ steps.filter.outputs.deploy == 'true' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'src/AppHost/**'
              - 'src/Core/**'
              - 'src/Infrastructure/**'
              - 'src/Infrastructure.PostgreSql/**'
              - 'src/Infrastructure.SqlServer/**'
              - 'src/Postgres.Migrator/**'
              - 'src/ServiceDefaults/**'
              - 'src/WebApi/**'
              - 'test/**'
              - 'MoneyGroup.slnx'
              - 'Directory.*.props'
              - 'Directory.*.targets'
              - 'global.json'
              - '.config/dotnet-tools.json'
              - 'testconfig.json'
              - '.github/workflows/**'
            deploy:
              - '.github/workflows/**'
              - '.dockerignore'

  backend:
    uses: ./.github/workflows/dotnet.yml
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    # Forward only the repository secrets dotnet.yml actually reads, instead of
    # handing it every repository secret via `secrets: inherit`.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  deploy:
    uses: ./.github/workflows/docker.yml
    needs: [changes, backend]
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' && needs.backend.result != 'failure' }}
    with:
      is-cd: ${{ github.event_name != 'pull_request' }}
      do-deploy: ${{ github.ref == 'refs/heads/main' }}
      environment: Development
    # `secrets: inherit` is load-bearing here — do not narrow it without reading
    # this first. docker.yml's deploy job reads AZURE_CLIENT_ID / AZURE_TENANT_ID /
    # AZURE_SUBSCRIPTION_ID / AZURE_CONTAINER_APP_NAME / AZURE_RESOURCE_GROUP, which
    # exist ONLY as secrets of the `Development` environment that job declares.
    #
    # A called workflow's `secrets` context is populated solely from what the caller
    # passes. Declaring `environment:` in the callee does not by itself pull that
    # environment's secrets into scope — `inherit` is what lets the callee resolve
    # secrets against the repository/environment store. Dropping it in #419 left
    # client-id and tenant-id empty and broke `azure/login` on the first main push
    # (run 31789136623); docker.yml was byte-identical to the last green run.
    #
    # Listing the AZURE_* secrets explicitly cannot work either: a job that `uses:`
    # a reusable workflow may not declare `environment:`, so they are out of scope
    # at this caller and would forward empty strings — the same failure.
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  gate:
    name: gate
    needs: [changes, backend, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce component checks by changed paths
        shell: bash
        run: |
          set -euo pipefail

          changes_result='${{ needs.changes.result }}'
          if [[ "${changes_result}" != "success" ]]; then
            echo "Change detection job did not succeed."
            exit 1
          fi

          be_needed='${{ needs.changes.outputs.backend }}'
          deploy_needed='${{ needs.changes.outputs.deploy }}'
          be_result='${{ needs.backend.result }}'
          deploy_result='${{ needs.deploy.result }}'

          echo "backend needed: ${be_needed}, result: ${be_result}"
          echo "deploy needed: ${deploy_needed}, result: ${deploy_result}"

          if [[ "${be_needed}" == "true" && "${be_result}" != "success" ]]; then
            echo "Backend checks were required but did not succeed."
            exit 1
          fi

          if [[ "${deploy_needed}" == "true" && "${deploy_result}" != "success" ]]; then
            echo "Deploy checks were required but did not succeed."
            exit 1
          fi

          echo "Monorepo gate passed."
