on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Runs every job, and deploys when started on main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect changes
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      # A CI change runs every job on its PR. Once merged it has been proven, so
      # it does not run them again or deploy.
      backend: ${{ steps.changes.outputs.backend == 'true' || (github.event_name == 'pull_request' && steps.changes.outputs.ci-config == 'true') }}
      frontend: ${{ steps.changes.outputs.frontend == 'true' || (github.event_name == 'pull_request' && steps.changes.outputs.ci-config == 'true') }}
      image: ${{ steps.changes.outputs.image == 'true' || (github.event_name == 'pull_request' && steps.changes.outputs.ci-config == 'true') }}
      deploy-api: ${{ steps.changes.outputs.image == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      deploy-web: ${{ steps.changes.outputs.frontend == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          workflow: gate.yml

  backend:
    uses: ./.github/workflows/dotnet.yml
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    # Forward only the repository secrets dotnet.yml actually reads, instead of
    # handing it every repository secret via `secrets: inherit`.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  frontend:
    uses: ./.github/workflows/clientapp.yml
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read

  image:
    uses: ./.github/workflows/docker.yml
    needs: [changes, backend]
    if: ${{ !cancelled() && needs.changes.outputs.image == 'true' && needs.backend.result != 'failure' }}
    with:
      publish: ${{ needs.changes.outputs.deploy-api == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write

  # The single required check. Its job name must stay `gate`.
  gate:
    name: gate
    needs: [changes, backend, frontend, image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce component checks by changed paths
        shell: bash
        run: |
          set -euo pipefail

          changes_result='${{ needs.changes.result }}'
          if [[ "${changes_result}" != "success" ]]; then
            echo "Change detection job did not succeed."
            exit 1
          fi

          be_needed='${{ needs.changes.outputs.backend }}'
          fe_needed='${{ needs.changes.outputs.frontend }}'
          image_needed='${{ needs.changes.outputs.image }}'
          be_result='${{ needs.backend.result }}'
          fe_result='${{ needs.frontend.result }}'
          image_result='${{ needs.image.result }}'

          echo "backend needed: ${be_needed}, result: ${be_result}"
          echo "frontend needed: ${fe_needed}, result: ${fe_result}"
          echo "image needed: ${image_needed}, result: ${image_result}"

          if [[ "${be_needed}" == "true" && "${be_result}" != "success" ]]; then
            echo "Backend checks were required but did not succeed."
            exit 1
          fi

          if [[ "${fe_needed}" == "true" && "${fe_result}" != "success" ]]; then
            echo "Frontend checks were required but did not succeed."
            exit 1
          fi

          if [[ "${image_needed}" == "true" && "${image_result}" != "success" ]]; then
            echo "Image build was required but did not succeed."
            exit 1
          fi

          echo "Monorepo gate passed."

  # Deploy jobs live here rather than in a reusable workflow so they can declare
  # `environment:` themselves. That unlocks the AZURE_* environment secrets
  # without `secrets: inherit`, which would hand every secret to the image build.
  deploy-api:
    name: deploy api
    needs: [changes, image, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.image.result == 'success' && needs.changes.outputs.deploy-api == 'true' }}
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      id-token: write
      contents: read
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Build the immutable image reference from the digest the image job
      # produced and signed. github.repository is mixed case
      # (vancodocton/MoneyGroup) and container registries reject non-lowercase
      # paths, so lowercase it here.
      - name: Resolve image reference
        id: image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::image job produced no digest, refusing to deploy."
            exit 1
          fi
          echo "ref=${REGISTRY,,}/${IMAGE_NAME,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy Azure Container App
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          registryUrl: ${{ env.REGISTRY }}
          imageToDeploy: ${{ steps.image.outputs.ref }}

  # Ships the dist the frontend job already built and linted.
  deploy-web:
    name: deploy web
    needs: [changes, frontend, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.frontend.result == 'success' && needs.changes.outputs.deploy-web == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: clientapp-dist
          path: src/ClientApp/dist

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_FOREST_03B3E8000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/src/ClientApp/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          production_branch: main
