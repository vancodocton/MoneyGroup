# Which paths affect which CI job. Read by .github/actions/detect-changes, so
# gate.yml and codeql.yml share one definition.

# CI itself. On a PR this runs every job, so a workflow change is proven before
# it merges.
ci-config:
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/filters.yml'

# Changes to how CodeQL runs, which can change the results for every language.
codeql-config:
  - '.github/workflows/codeql.yml'
  - '.github/actions/detect-changes/**'
  - '.github/filters.yml'

# Also decides the API image: it is rebuilt, and on main deployed, for any of these.
backend:
  - 'src/AppHost/**'
  - 'src/ClientApp/*.esproj'
  - 'src/Core/**'
  - 'src/Infrastructure/**'
  - 'src/Infrastructure.SqlServer/**'
  - 'src/Migrator/**'
  - 'src/ServiceDefaults/**'
  - 'src/WebApi/**'
  - 'test/**'
  - 'MoneyGroup.slnx'
  - 'Directory.*.props'
  - 'Directory.*.targets'
  - 'global.json'
  - '.config/dotnet-tools.json'
  - 'testconfig.json'
  - '.dockerignore'

frontend:
  - 'src/ClientApp/**'
